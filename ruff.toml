extend-exclude = ["users", "validation/testdata", "examples/ultimate_wall_follower"]

# A frozen dataclass with immutable fields is a safe default value
# (AGENTS.md rule 1: `params: Params = Params()`). ruff B008 does not know this
# yet (https://github.com/astral-sh/ruff/issues/29071). List each such class
# that is a function default here. RUF009 already allows them as dataclass
# field defaults. When ruff fixes B008, remove this section.
[lint.flake8-bugbear]
extend-immutable-calls = ["neoracer_mujoco.envs.neoracer_env.NeoRacerEnvConfig"]
