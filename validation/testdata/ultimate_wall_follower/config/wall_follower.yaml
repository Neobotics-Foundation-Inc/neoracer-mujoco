# Ultimate Wall Follower parameters.
#
# Edit these between test runs, then press START to reload (no restart needed).
# `speed` is the primary knob; the rest have sane defaults and rarely need
# changing. Missing keys fall back to the defaults in control.py Config.
# Distances are in cm, angles in degrees, gains unitless.

speed: 1.0                 # forward pace in [0, 1]; raise to go faster

wall_beams:
  abeam_right_deg: 90.0    # beam pointing abeam right
  abeam_left_deg: 270.0    # beam pointing abeam left
  beam_theta_deg: 50.0     # forward tilt of the second beam per wall
  beam_window_deg: 6.0     # averaging window per beam

forward_probe:
  front_window_deg: 14.0   # narrow look straight ahead for clearance

lookahead:                 # L = base + gain * speed
  lookahead_base_cm: 30.0
  lookahead_gain_cm: 120.0

centering_pd:              # acts on projected right-minus-left distance (cm)
  kp: 0.005
  kd: 0.00008

follow_the_gap:
  gap_arc_deg: 150.0       # front arc searched for a gap
  gap_bubble_deg: 16.0     # safety bubble masked around nearest obstacle
  gap_min_dist_cm: 200.0    # a sample is "free" beyond this depth
  gap_steer_gain: 0.9      # gap bearing (rad) -> steering, pre-clamp

blend:                     # full wall above hi, full gap below lo
  blend_hi_cm: 5001.0
  blend_lo_cm: 5000.0
  blend_hi_gain_cm: 5000.0  # * speed, added to both thresholds

adaptive_speed:
  speed_full_cm: 200.0     # clearance at/above which speed is unscaled
  speed_stop_cm: 25.0      # clearance at which speed hits the floor
  speed_min_frac: 0.7     # clearance speed floor
  turn_slow_k: 0.15         # speed *= (1 - k * |angle|)
  turn_min_frac: 0.35      # steering speed floor

output_filter:
  steer_ema: 0.55          # fraction of the previous steering command retained

display:
  turn_deadband: 0.06      # |angle| below this shows straight (blank) on the panel
