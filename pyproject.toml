[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neoracer-mujoco"
version = "0.1.0"
description = "MuJoCo simulation baseline + reusable toolbox for the NeoRacer 1/12-scale RC car."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "mujoco>=3.9.0",
    "numpy>=1.26.4",
    # CubicSpline (track centerline) and KDTree (self-touch check) in
    # track_generation/.
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
    "gymnasium>=1.0",
    "pygame-ce>=2.5.8",
    "jax>=0.11",
    "optax>=0.2.8",
    "pytest>=7.4",
    "ruff==0.17.0",
    "ty==0.0.86",
    "pybind11-stubgen==3.0.0",
]
# Optional: only needed for src/neoracer_mujoco/envs/ (issue #7). The base
# package must stay importable without gymnasium installed.
rl = ["gymnasium>=1.0"]
# Optional: only needed for the PPO baseline (examples/train_ppo.py).
# JAX and optax, not PyTorch: PyTorch has no wheels for Python 3.15.
train = ["gymnasium>=1.0", "jax>=0.11", "optax>=0.2.8"]
# Optional: only needed for the pygame driving demo (examples/pygame_drive/).
# pygame-ce, not pygame: pygame has no wheels for Python 3.15.
demo = ["pygame-ce>=2.5.8"]

[tool.pytest.ini_options]
# A bare `pytest` runs only the test suite. users/ holds experiments that are
# not tests; `pytest users/<name>` still runs a folder on purpose.
testpaths = ["validation"]

[tool.ty.environment]
# typings/ holds mujoco stubs from `pybind11-stubgen mujoco mujoco.viewer -o typings`.
# The examples directories are on sys.path at runtime for the scripts and tests
# that import from them.
extra-paths = ["typings", "examples"]

[tool.ty.src]
exclude = ["users", "validation/testdata", "examples/ultimate_wall_follower", "typings"]

[tool.hatch.build.targets.wheel]
packages = ["src/neoracer_mujoco"]

# assets/ stays at the repo root, so that users can open the XML files in other
# MuJoCo tools. The wheel copies it into the package, where assets.py finds it.
[tool.hatch.build.targets.wheel.force-include]
"assets" = "neoracer_mujoco/data"
