[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neoracer-mujoco"
version = "0.12.0"
description = "MuJoCo simulation baseline + reusable toolbox for the NeoRacer, a 1/12-scale autonomous racing car."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # One exact version: MuJoCo's WebAssembly build of the same version gives
    # the same physics, and its models (.mjb) load only in the version that
    # wrote them. Change it here and in requirements.txt together.
    "mujoco==3.16.0",
    "numpy>=1.26.4",
    # CubicSpline (track centerline) and KDTree (self-touch check) in
    # track_generation/.
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
    "pygame-ce>=2.5.8",
    "pytest>=7.4",
    "ruff==0.17.1",
    "ty==0.0.87",
    "pybind11-stubgen==3.0.0",
]
# Optional: the Warp backend of batch.py (batch_warp.py), MJX on MuJoCo Warp.
# It runs on a CUDA GPU; install jax[cuda12] or jax[cuda13] for the GPU.
jax = ["jax>=0.7", "mujoco-mjx==3.16.0", "warp-lang>=1.10", "mujoco-warp==3.16.0"]
# Optional: only needed for the pygame driving demo (examples/pygame_drive/).
# pygame-ce, not pygame: pygame has no wheels for Python 3.14.
demo = ["pygame-ce>=2.5.8"]

[tool.pytest.ini_options]
# A bare `pytest` runs only the test suite. users/ holds experiments that are
# not tests; `pytest users/<name>` still runs a folder on purpose.
testpaths = ["validation"]

[tool.ty.environment]
# typings/ holds mujoco stubs from `pybind11-stubgen mujoco mujoco.viewer mujoco.rollout -o typings`.
# The examples directories are on sys.path at runtime for the scripts and tests
# that import from them.
extra-paths = ["typings", "examples"]

[tool.ty.analysis]
# batch_warp.py needs the jax extra, which the CI type check does not install.
allowed-unresolved-imports = ["jax", "jax.numpy", "mujoco.mjx"]

[tool.ty.src]
exclude = ["users", "validation/testdata", "examples/ultimate_wall_follower", "typings"]

[tool.hatch.build.targets.wheel]
packages = ["src/neoracer_mujoco", "src/neoracer_spec"]

# assets/ stays at the repo root, so that users can open the XML files in other
# MuJoCo tools. The wheel copies it into the package, where assets.py finds it.
[tool.hatch.build.targets.wheel.force-include]
"assets" = "neoracer_mujoco/data"
