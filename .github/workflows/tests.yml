name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      # The meshes in assets/meshes/ are Git LFS objects. Without them,
      # MuJoCo cannot compile the car model.
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.15"
          cache: pip

      # gymnasium is the optional rl dependency. Without it, the tests of
      # NeoRacerEnv are skipped.
      - name: Install dependencies
        run: |
          pip install -r requirements.txt "gymnasium>=1.0"
          pip install -e .

      - name: Run the validation suite
        run: python -m pytest -q validation
