name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      # The meshes in assets/meshes/ are Git LFS objects. Without them,
      # MuJoCo cannot compile the car model.
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.15"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run the validation suite
        run: python -m pytest -q validation

      # The suite above uses the editable install, which reads assets/ from the
      # checkout. This step tests what pip users get: it builds the wheel,
      # installs it in a fresh environment and loads the car and every track
      # from outside the checkout.
      - name: Load the car and the tracks from the installed wheel
        run: |
          pip install build
          python -m build --wheel
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          export EXPECTED_TRACKS=$(ls assets/tracks/*.xml | wc -l)
          cd /tmp
          /tmp/wheel-env/bin/python -c "
          import os
          import mujoco
          from neoracer_mujoco import assets, load
          assert 'site-packages' in assets.ASSET_DIR, assets.ASSET_DIR
          tracks = assets.tracks()
          assert len(tracks) == int(os.environ['EXPECTED_TRACKS']), tracks
          load()
          for track in tracks:
              assets.compose(mujoco.MjSpec.from_file(track))
          print(len(tracks), 'tracks loaded from', assets.ASSET_DIR)
          "

  # The JS package (js/) against this package: js/test/fixtures.py runs a
  # set of cases in Python, and npm test runs the same cases in MuJoCo's
  # WebAssembly build. It runs beside pytest. The scenes leave out the meshes
  # that only show the car, so the checkout needs no Git LFS objects, and the
  # runner's own Node runs the tests.
  js:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.15"
          cache: pip

      - name: Install the package and the JS dependencies
        run: |
          pip install -e .
          npm ci --prefix js --no-audit --no-fund

      - name: Run the JS tests against the Python package
        run: |
          python js/test/fixtures.py js/test/fixtures.json
          npm test --prefix js
