name: Delete merged branches

# Deletes each branch under bassel/ that is done with: it has a pull request,
# none of its pull requests is open, and it still points at the head of one of
# them, so every commit on it is kept by a pull request. Other people's
# branches are theirs to delete. It runs on each push to main, which is when a
# pull request merges, and from "Run workflow" in the Actions tab. A deleted
# branch can be restored from its pull request's page.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # delete the branches
  pull-requests: read

# One run at a time, so that two runs never delete the same branch.
concurrency:
  group: delete-merged-branches

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the branches under bassel/ whose pull requests are closed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/branches" \
            --jq '.[] | select(.name | startswith("bassel/")) | "\(.name) \(.commit.sha)"' > branches.txt
          # The loop reads the list on fd 3, so that no command in it can read
          # the list from stdin.
          while read -r branch sha <&3; do
            verdict=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state all --json state,headRefOid \
              --jq "if length > 0 and all(.state != \"OPEN\") and any(.headRefOid == \"$sha\") then \"delete\" else \"keep\" end")
            if [ "$verdict" = delete ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
              echo "deleted $branch"
            else
              echo "kept $branch"
            fi
          done 3< branches.txt
