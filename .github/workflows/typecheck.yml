name: Typecheck

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ty:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      # mujoco ships no type stubs. Generate them from the installed version.
      # --exit-code fails the step on a stub error. The ignore patterns are
      # the known errors: C++ types that mujoco's bindings do not expose.
      - name: Generate mujoco stubs
        run: >-
          pybind11-stubgen mujoco mujoco.viewer mujoco.rollout -o typings --exit-code
          --ignore-invalid-expressions '^(mujoco::python::.*|std::byte)$'
          --ignore-unresolved-names '^(NoneType|_abc\._abc_data|mjs[A-Za-z]+_)$'

      - name: ty
        run: ty check --output-format github
