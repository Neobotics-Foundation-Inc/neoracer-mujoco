name: Release

# Builds the wheel, checks that the installed wheel can load the car, and
# attaches the wheel, the car as neoracer.mjz and the JS package (js/) to a
# GitHub Release. Other repos, such as neoracer-rl, install neoracer-mujoco
# from that wheel.
#
# Start a release in one of two ways:
# - Push a version tag such as v0.2.0. The tag must match the version in pyproject.toml.
# - Click "Run workflow" on main in the Actions tab. The workflow then creates
#   the tag v<version> from pyproject.toml itself, on the commit it built, and
#   stops if that tag already exists.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the tag (manual runs) and the GitHub Release

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      # The meshes in assets/meshes/ are Git LFS objects. The wheel must contain
      # the real files, not the LFS pointers. The job token can write to the repo,
      # so checkout does not keep it in the git config while pip runs package code.
      # The payload's CAD model, which the wheel does not hold, is left out, as
      # in tests.yml.
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          lfs: true
          persist-credentials: false
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: lfs.fetchexclude
          GIT_CONFIG_VALUE_0: cad/**/*.step

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      # A pushed tag must match the version. A manual run must start from main.
      - name: Choose the tag from the version in pyproject.toml
        id: tag
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          tag="v$version"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$GITHUB_REF_NAME" = "$tag" || { echo "tag $GITHUB_REF_NAME, version $version"; exit 1; }
          else
            test "$GITHUB_REF" = refs/heads/main || { echo "run the release from main, not $GITHUB_REF"; exit 1; }
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build the wheel
        run: |
          pip install build
          python -m build --wheel

      # Install the wheel in a fresh environment and load the car from outside
      # the checkout, so that the test cannot use the repo's assets/.
      - name: Load the car from the installed wheel
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-env/bin/python -c "import neoracer_mujoco; neoracer_mujoco.load()"

      # The car as one archive, for MuJoCo without Python, such as its
      # WebAssembly build. It is written from the installed wheel, so it holds
      # the wheel's XML and meshes, and it must load before it is published.
      - name: Write neoracer.mjz from the installed wheel
        run: |
          /tmp/wheel-env/bin/python -c "from neoracer_mujoco import assets; assets.write_mjz(assets.DEFAULT_CAR, 'dist/neoracer.mjz')"
          /tmp/wheel-env/bin/python -c "import mujoco; mujoco.MjSpec.from_zip('dist/neoracer.mjz').compile()"

      # The JS package (js/), for MuJoCo's WebAssembly build, as an npm
      # tarball. It must install and load the car before it is published.
      - name: Pack the JS package
        run: |
          npm ci --prefix js --no-audit --no-fund
          (cd js && npm pack --pack-destination ../dist)
          mkdir /tmp/js-check && cd /tmp/js-check
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/dist/neoracer-mujoco-*.tgz @mujoco/mujoco@3.16.0
          cat > check.mjs <<'EOF'
          import loadMujoco from '@mujoco/mujoco';
          import { compose, settle } from 'neoracer-mujoco';
          const mj = await loadMujoco();
          const floor = '<mujoco><worldbody><geom type="plane" size="5 5 .1"/></worldbody></mujoco>';
          const scene = compose(mj, floor);
          const z = settle(mj, scene.model).qpos[2];
          if (!(z > 0.02 && z < 0.1)) throw new Error(`the packed car does not rest on the floor: z = ${z} m`);
          console.log(`the packed car rests at z = ${z.toFixed(4)} m`);
          EOF
          node check.mjs

      # A manual run creates the tag on the commit that this job built. GitHub
      # refuses to create a tag that already exists, so the run stops instead of
      # publishing under a tag that points at another commit. --verify-tag stops
      # gh from creating a tag itself.
      - name: Attach the wheel, neoracer.mjz and the JS package to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null
          fi
          gh release create "$TAG" dist/*.whl dist/neoracer.mjz dist/neoracer-mujoco-*.tgz --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes
