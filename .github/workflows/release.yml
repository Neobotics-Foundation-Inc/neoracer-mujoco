name: Release

# Builds the wheel when someone pushes a version tag such as v0.2.0, checks that
# the installed wheel can load the car, and attaches the wheel to a GitHub Release.
# Other repos, such as neoracer-rl, install neoracer-mujoco from that wheel.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # gh release create

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      # The meshes in assets/meshes/ are Git LFS objects. The wheel must contain
      # the real files, not the LFS pointers.
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.15"

      - name: Check that the tag matches the version in pyproject.toml
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME, version $version"; exit 1; }

      - name: Build the wheel
        run: |
          pip install build
          python -m build --wheel

      # Install the wheel in a fresh environment and load the car from outside
      # the checkout, so that the test cannot use the repo's assets/.
      - name: Load the car from the installed wheel
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-env/bin/python -c "import neoracer_mujoco; neoracer_mujoco.load()"

      - name: Attach the wheel to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl --title "$GITHUB_REF_NAME" --generate-notes
