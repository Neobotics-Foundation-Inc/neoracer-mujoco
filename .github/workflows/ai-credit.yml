name: AI credit

# People may credit AI tools in their own commits and pull requests, but the
# commit on main names only people. A pull request is squash-merged with its
# title and description as the commit message (repo setting), so trailers in
# the branch's commits do not reach main. This workflow removes AI credit from
# the description each time it changes, and checks every commit that reaches
# main. .github/ai_credit.py says which lines count as AI credit.

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  clean-description:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    # One run at a time per pull request, so that an older run cannot finish
    # last and write back a description that the author has edited since.
    concurrency:
      group: ai-credit-${{ github.event.pull_request.number }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      # pull_request_target checks out main, never the code of the pull request.
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.15"

      - name: Remove AI credit from the description
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Read the description now, not the copy in the event, which may be older.
          gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" --jq '.body // ""' > body.txt
          python .github/ai_credit.py clean < body.txt > cleaned.txt
          if ! cmp -s body.txt cleaned.txt; then
            jq -n --rawfile body cleaned.txt '{body: $body}' |
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" --input - > /dev/null
          fi

  check-main:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.15"

      - name: Check the new commits on main
        run: jq -r '.commits[].message' "$GITHUB_EVENT_PATH" | python .github/ai_credit.py check
