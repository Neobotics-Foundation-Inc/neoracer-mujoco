name: Strip Claude Code footer

# A Claude Code cloud session writes to GitHub through a proxy, and the proxy
# adds a "Generated by Claude Code" footer to each post. No setting turns it
# off (anthropics/claude-code#101004), so this workflow removes it. See
# tools/strip_claude_footer.py.
#
# An edit by this workflow's GITHUB_TOKEN does not start another workflow run,
# so the workflow does not trigger itself.

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  # pull_request_target, not pull_request: the token can then also edit the
  # description of a pull request from a fork. The job checks out the base
  # branch only and never runs code from the pull request.
  pull_request_target:
    types: [opened, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]
  # A manual run removes the footer from every existing post.
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  strip:
    # Only posts that can have the footer: a manual run, or a post by a user
    # (Claude Code posts as the person who uses it), not by a bot.
    if: github.event_name == 'workflow_dispatch' || github.event.sender.type == 'User'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Remove the footer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/strip_claude_footer.py
